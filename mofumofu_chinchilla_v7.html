<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>もふもふチンチラ牧場 v7</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5e9da;color:#71563e;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif}main{max-width:520px;margin:auto;padding:12px 12px 35px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.top h1{font-size:19px;margin:8px 0 3px}.sub{font-size:12px;color:#9b7c61}.coins{background:#fffaf1;border-radius:30px;padding:10px 14px;font-weight:bold;white-space:nowrap}.room{position:relative;height:360px;overflow:hidden;border-radius:20px;background:linear-gradient(#f8ecd7 0 59%,#d9b58d 59%);border:3px solid #e5c9a6;margin-top:14px;touch-action:manipulation}.room:before{content:'';position:absolute;left:7%;top:8%;width:86px;height:100px;background:linear-gradient(90deg,transparent 47%,#d4ac83 47% 53%,transparent 53%),linear-gradient(transparent 47%,#d4ac83 47% 53%,transparent 53%),#fff7dd;border:8px solid #d4ac83;border-radius:8px}.room:after{content:'';position:absolute;top:59%;width:100%;border-top:3px solid #b78f6b;pointer-events:none}.toy{position:absolute;z-index:3;border:2px solid #d4b18c;border-radius:16px;background:#fffaf0e8;min-width:92px;min-height:86px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#75583f;font-weight:bold;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;box-shadow:0 4px 0 #bfa07d}.toy:active{transform:translateY(3px);box-shadow:0 1px 0 #bfa07d}.toy .emoji{font-size:30px}.toy small{font-size:11px;font-weight:normal}.toy.locked{opacity:.65}.toy:nth-of-type(1){bottom:10px;left:3%}.toy:nth-of-type(2){bottom:10px;left:36%}.toy:nth-of-type(3){bottom:10px;right:3%}.progress{width:76px;height:5px;background:#e9ddca;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;background:#89b47b}.pet{position:absolute;z-index:2;width:66px;height:76px;transition:left 1.8s ease-in-out,top 1.8s ease-in-out;pointer-events:none;filter:drop-shadow(0 4px 2px #876b5140)}.pet svg{width:100%;height:100%;animation:bob 1.6s ease-in-out infinite alternate}.pet.play svg{animation:hop .5s ease-in-out infinite alternate}.pet.sleep svg{animation:none}@keyframes bob{to{transform:translateY(-4px)}}@keyframes hop{to{transform:translateY(-13px) rotate(6deg)}}.panel{background:#fffaf1;border-radius:16px;padding:14px;margin-top:12px}.message{min-height:35px;text-align:center;font-size:13px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}.tabs button,.primary,.secondary{border:0;border-radius:12px;padding:12px 6px;font-weight:bold;font-size:13px;cursor:pointer}.tabs button{background:#e9dac5;color:#765b44}.tabs button.active{background:#8aa981;color:#fff}.primary{background:#86aa7d;color:#fff;width:100%;margin-top:12px}.primary:disabled{background:#c8c5bb}.secondary{background:#e7d7c1;color:#765b44}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.hide{display:none}.petgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.petcard{border-radius:12px;background:#f0e5d5;padding:10px;text-align:center;font-size:12px}.swatch{width:42px;height:42px;border-radius:50%;margin:0 auto 6px;border:2px solid #fff}.hint{font-size:12px;line-height:1.7;color:#967b63}.flash{position:absolute;z-index:5;color:#4d874b;font-weight:900;pointer-events:none;animation:rise .85s ease-out forwards}@keyframes rise{to{transform:translateY(-50px);opacity:0}}select{border:1px solid #d7bfa3;border-radius:9px;padding:10px;background:white;color:#765b44;max-width:46%}
/* v7: room themes and lively character animations */
.room{isolation:isolate;background:linear-gradient(#f8ecd7 0 59%,#d9b58d 59%)}
.room.theme-mint{background:linear-gradient(#e7f4e4 0 59%,#c8b9a0 59%)}
.room.theme-sky{background:linear-gradient(#e4effb 0 59%,#d9bd9c 59%)}
.room.theme-rose{background:linear-gradient(#f8e4e8 0 59%,#d9b29d 59%)}
.pet{will-change:left,top;transition:left 1.6s cubic-bezier(.25,.75,.35,1),top 1.6s cubic-bezier(.25,.75,.35,1);transform-origin:center bottom}
.pet.walk svg{animation:waddle .28s ease-in-out infinite alternate}
.pet.hop svg{animation:hop .36s ease-in-out infinite alternate}
.pet.eat svg{animation:nibble .19s ease-in-out infinite alternate}
.pet.bath svg{animation:roll .65s ease-in-out infinite}
.pet.run svg{animation:run .2s ease-in-out infinite alternate}
.pet.sleep svg{animation:none;transform:rotate(12deg) translateY(6px)}
@keyframes waddle{to{transform:rotate(5deg) translateY(-3px)}}
@keyframes nibble{to{transform:translateY(2px) scaleY(.97)}}
@keyframes roll{50%{transform:rotate(24deg) translateY(-8px)}100%{transform:rotate(-12deg)}}
@keyframes run{to{transform:translateX(3px) translateY(-6px) rotate(-5deg)}}
.pet .thought{position:absolute;top:-22px;left:40px;font-size:17px;filter:none;animation:floaty 1.3s ease-in-out infinite alternate}
@keyframes floaty{to{transform:translateY(-7px)}}
.pet.play{z-index:2}
.petname{position:absolute;top:70px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;background:#fff9e8d9;border-radius:8px;padding:2px 5px;color:#765940}
.shopgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.themebtn{border:2px solid #e0c5a4;border-radius:12px;background:#f8eddd;padding:12px 5px;color:#74583e;font-weight:bold;min-height:66px}
.themebtn.chosen{border-color:#79a274;background:#e6f0df}
.nameinput{width:100%;max-width:100%;padding:9px;border-radius:8px;border:1px solid #d8c3a9;color:#70563e}
.petcard{overflow:hidden}.petcard svg{width:65px;height:70px;display:block;margin:auto}
@media(prefers-reduced-motion:reduce){.pet,.pet svg{animation:none!important;transition:none!important}}
</style></head><body><main><div class="top"><div><h1>🐭 もふもふチンチラ牧場</h1><div class="sub" id="stats"></div></div><div class="coins">🪙 <span id="coins">0</span></div></div><div id="roomPage"><div class="room" id="room"><button type="button" class="toy" data-index="0"><span class="emoji">🌿</span><span>牧草</span><small></small><div class="progress"><i></i></div></button><button type="button" class="toy" data-index="1"><span class="emoji">🛁</span><span>砂浴び</span><small></small><div class="progress"><i></i></div></button><button type="button" class="toy" data-index="2"><span class="emoji">🎡</span><span>回し車</span><small></small><div class="progress"><i></i></div></button></div><div class="panel message" id="message">お部屋のアイテムをタップしてね！</div><div class="panel"><div class="row"><b>🐾 自動収益</b><span id="rate"></span></div><div class="hint">チンチラが10秒ごとに遊んでコインを集めるよ。画面を閉じている間も最大2時間分の収益を獲得できるよ。</div></div></div><div class="panel"><div class="row"><b>🎨 お部屋の模様替え</b><span class="hint" id="themeStatus"></span></div><div class="shopgrid" id="themes"></div></div><div id="adoptPage" class="panel hide"><h3>🐭 お迎え</h3><p>新しい子が増えるとタップ倍率と自動収益がアップ！</p><div id="adoptPrice"></div><button class="primary" id="adopt">新しい子をお迎え</button></div><div id="breedPage" class="panel hide"><h3>💕 繁殖ルーム</h3><p>親を2匹選んで、赤ちゃんを迎えよう。</p><div class="row"><select id="parent1"></select><span>♥</span><select id="parent2"></select></div><p class="hint">200コイン / 5分。繁殖が終わると赤ちゃんが仲間入りするよ。</p><div id="breedStatus"></div><button class="primary" id="breed">繁殖する</button></div><div id="bookPage" class="panel hide"><h3>📖 毛色図鑑</h3><div id="bookCount"></div><div class="petgrid" id="book"></div><h3>うちのチンチラ</h3><p class="hint">名前と性格を確認できるよ。名前を変更するにはカードの「名前変更」を押してね。</p><div class="petgrid" id="petlist"></div></div><div class="tabs"><button data-page="room" class="active">🏠 おへや</button><button data-page="adopt">🐾 お迎え</button><button data-page="breed">💕 繁殖</button><button data-page="book">📖 図鑑</button></div><p class="hint" style="text-align:center">v7 ブラウザ版 · この端末のブラウザに自動保存</p></main><script>
(()=>{'use strict';
const KEY='mofumofu_v6_save';const defs=[{name:'牧草',base:1},{name:'砂浴び',base:3},{name:'回し車',base:5}];const furs=[['gray','スタンダードグレー','#999da5'],['cream','ベージュ','#e8d2ad'],['white','ホワイト','#f4f0e9'],['black','ブラックベルベット','#48434a'],['violet','バイオレット','#ada3c8'],['ebony','エボニー','#343238']];const furById=id=>furs.find(f=>f[0]===id)||furs[0];const $=id=>document.getElementById(id);const need=lv=>Math.ceil(10*Math.pow(lv,1.5));const rand=n=>Math.floor(Math.random()*n);const fresh=()=>({coins:0,items:[{lv:1,xp:0},{lv:1,xp:0},{lv:1,xp:0}],pets:[{id:1,fur:'gray',name:'グレーちゃん'},{id:2,fur:'cream',name:'クリームちゃん'}],nextId:3,breeding:null,lastTime:Date.now(),lastAuto:Date.now(),theme:'classic',ownedThemes:['classic']});let s=fresh();try{const stored=JSON.parse(localStorage.getItem(KEY));if(stored&&Array.isArray(stored.items)&&Array.isArray(stored.pets)&&stored.pets.length){s={...s,...stored}}}catch(e){}let page='room',activity=new Map(),petPositions=new Map(),petModes=new Map();s.theme=s.theme||'classic';s.ownedThemes=Array.isArray(s.ownedThemes)?s.ownedThemes:['classic'];const themes=[['classic','🌼 いつものお部屋',0],['mint','🌱 ミント',150],['sky','☁️ 空色',250],['rose','🌸 さくら',350]];const personality=id=>['のんびり屋','食いしん坊','元気いっぱい','甘えん坊','好奇心旺盛'][id%5];const save=()=>{s.lastTime=Date.now();try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}};const mult=()=>1+.1*(s.pets.length-1);const price=()=>Math.floor(100*Math.pow(1.6,s.pets.length-1));const income=()=>s.pets.reduce((sum,p,i)=>{const idx=i%3;return sum+Math.max(1,Math.floor(defs[idx].base*s.items[idx].lv*.5))},0);const show=t=>{$('message').textContent=t};
function addPet(fur,name){s.pets.push({id:s.nextId++,fur,name});show('🐭 '+name+'が仲間入り！');save();render()}
function checkBreed(){if(s.breeding&&Date.now()>=s.breeding.end){const b=s.breeding;s.breeding=null;const pool=[b.fur1,b.fur2,'white','violet','ebony'];const fur=pool[rand(pool.length)];addPet(fur,furById(fur)[1]+'の赤ちゃん')}}
function grantOffline(){const elapsed=Math.max(0,Date.now()-(Number(s.lastTime)||Date.now()));const periods=Math.floor(Math.min(elapsed,7200000)/10000);if(periods>0){const earned=Math.floor(periods*income()*.5);s.coins+=earned;show('おかえり！ 放置収益 +'+earned+'コイン');}s.lastAuto=Date.now();save()}
function petSVG(fur){const color=furById(fur)[2];const eyes=fur==='cream'?'#873f48':'#242027';return `<svg viewBox="0 0 80 90" aria-hidden="true"><path d="M56 56 Q83 47 69 24" stroke="${color}" stroke-width="13" fill="none" stroke-linecap="round"/><ellipse cx="22" cy="26" rx="15" ry="21" fill="${color}" stroke="#8d8077"/><ellipse cx="58" cy="26" rx="15" ry="21" fill="${color}" stroke="#8d8077"/><ellipse cx="22" cy="26" rx="9" ry="14" fill="#e7adb5"/><ellipse cx="58" cy="26" rx="9" ry="14" fill="#e7adb5"/><ellipse cx="40" cy="55" rx="33" ry="32" fill="${color}" stroke="#8d8077"/><ellipse cx="40" cy="70" rx="19" ry="12" fill="#fff8e8" opacity=".48"/><circle cx="27" cy="50" r="5" fill="${eyes}"/><circle cx="53" cy="50" r="5" fill="${eyes}"/><circle cx="26" cy="48" r="1.5" fill="white"/><circle cx="52" cy="48" r="1.5" fill="white"/><ellipse cx="40" cy="63" rx="4" ry="3" fill="#eaa1ac"/><path d="M35 67 Q40 72 45 67" stroke="#825b60" stroke-width="1.5" fill="none"/><path d="M8 58 L23 61 M57 61 L72 58 M8 66 L23 64 M57 64 L72 66" stroke="#837b75"/></svg>`}
function renderPets(){const room=$('room');const present=new Set();s.pets.forEach((p,i)=>{present.add(p.id);let el=room.querySelector('[data-pet="'+p.id+'"]');if(!el){el=document.createElement('div');el.className='pet';el.dataset.pet=p.id;el.innerHTML=petSVG(p.fur)+'<span class="petname"></span><span class="thought"></span>';room.appendChild(el)}const pos=petPositions.get(p.id)||{x:15+(i*23)%75,y:35+(i%3)*9};el.style.left=pos.x+'%';el.style.top=pos.y+'%';const active=(activity.get(p.id)||0)>Date.now();const mode=active?(petModes.get(p.id)||'hop'):'walk';el.className='pet '+mode+(active?' play':'');el.querySelector('.petname').textContent=p.name;el.querySelector('.thought').textContent=active?({eat:'🌿',bath:'✨',run:'💨',sleep:'💤',hop:'💕'}[mode]||''):''});room.querySelectorAll('[data-pet]').forEach(el=>{if(!present.has(Number(el.dataset.pet)))el.remove()})}
function render(){checkBreedSafe();$('room').className='room'+(s.theme==='classic'?'':' theme-'+s.theme);$('coins').textContent=Math.floor(s.coins).toLocaleString('ja-JP');$('stats').textContent=s.pets.length+'匹 · タップ倍率 ×'+mult().toFixed(1);$('rate').textContent='+'+income()+' 🪙 / 10秒';document.querySelectorAll('.toy').forEach((b,i)=>{const it=s.items[i];b.querySelector('small').textContent='Lv.'+it.lv+' · +'+Math.max(1,Math.floor(defs[i].base*it.lv*mult()))+'🪙';b.querySelector('i').style.width=(it.xp/need(it.lv)*100)+'%'});renderPets();$('adoptPrice').textContent='必要コイン：'+price().toLocaleString()+' 🪙';$('adopt').disabled=s.coins<price()||s.pets.length>=20;$('breed').disabled=s.coins<200||s.pets.length<2||s.pets.length>=20||!!s.breeding;$('breedStatus').textContent=s.breeding?'誕生まで あと '+Math.max(0,Math.ceil((s.breeding.end-Date.now())/1000))+'秒':'';const selects=[$('parent1'),$('parent2')];selects.forEach((el,i)=>{const old=el.value;el.innerHTML=s.pets.map(p=>`<option value="${p.id}">${p.name.replaceAll('<','&lt;')}</option>`).join('');if(s.pets.some(p=>String(p.id)===old))el.value=old;else el.selectedIndex=Math.min(i,s.pets.length-1)});$('bookCount').textContent='発見 '+furs.filter(f=>s.pets.some(p=>p.fur===f[0])).length+' / 6種類';$('book').innerHTML=furs.map(f=>{const found=s.pets.some(p=>p.fur===f[0]);return `<div class="petcard"><div class="swatch" style="background:${found?f[2]:'#c7c0b7'}"></div>${found?f[1]:'？？？'}</div>`}).join('');$('petlist').innerHTML=s.pets.map(p=>`<div class="petcard">${petSVG(p.fur)}<div class="pet-title"></div><div class="hint">${personality(p.id)}</div><button class="secondary rename" data-id="${p.id}" type="button">名前変更</button></div>`).join('');$('petlist').querySelectorAll('.petcard').forEach((card,i)=>card.querySelector('.pet-title').textContent=s.pets[i].name);$('themes').innerHTML=themes.map(t=>`<button class="themebtn ${s.theme===t[0]?'chosen':''}" data-theme="${t[0]}">${t[1]}<br><small>${s.ownedThemes.includes(t[0])?'使用する':t[2]+' 🪙'}</small></button>`).join('');$('themeStatus').textContent='所持 '+s.ownedThemes.length+'/4'}
let checking=false;function checkBreedSafe(){if(checking)return;checking=true;checkBreed();checking=false}
function flash(i,gain){const toy=document.querySelector('.toy[data-index="'+i+'"]');const r=toy.getBoundingClientRect(),rr=$('room').getBoundingClientRect();const e=document.createElement('span');e.className='flash';e.textContent='+'+gain+' 🪙';e.style.left=(r.left-rr.left+15)+'px';e.style.top=(r.top-rr.top-8)+'px';$('room').appendChild(e);setTimeout(()=>e.remove(),900)}
function tap(i){const it=s.items[i],old=it.lv;const gain=Math.max(1,Math.floor(defs[i].base*it.lv*mult()));s.coins+=gain;it.xp++;while(it.xp>=need(it.lv)){it.xp-=need(it.lv);it.lv++}const pet=s.pets[rand(s.pets.length)];petPositions.set(pet.id,{x:[11,42,72][i],y:44});activity.set(pet.id,Date.now()+2700);petModes.set(pet.id,['eat','bath','run'][i]);flash(i,gain);show(['🌿 もぐもぐ、おいしい！','🛁 くるくる砂浴び！','🎡 元気いっぱい走った！'][i]+' +'+gain+'コイン'+(it.lv>old?' 🎉 Lv.'+it.lv+'！':''));save();render()}
function wander(){s.pets.forEach((p,i)=>{if((activity.get(p.id)||0)>Date.now())return;petPositions.set(p.id,{x:6+rand(78),y:31+rand(20)});if(rand(5)===0){activity.set(p.id,Date.now()+1800);petModes.set(p.id,['hop','eat','sleep'][rand(3)])}});renderPets()}
$('themes').addEventListener('click',e=>{const b=e.target.closest('[data-theme]');if(!b)return;const t=themes.find(x=>x[0]===b.dataset.theme);if(!t)return;if(!s.ownedThemes.includes(t[0])){if(s.coins<t[2]){show('コインが足りないよ！');return}s.coins-=t[2];s.ownedThemes.push(t[0])}s.theme=t[0];show('🎨 お部屋を模様替えしたよ！');save();render()});$('petlist').addEventListener('click',e=>{const b=e.target.closest('.rename');if(!b)return;const p=s.pets.find(x=>x.id===Number(b.dataset.id));if(!p)return;const name=prompt('チンチラの名前（12文字まで）',p.name);if(name===null)return;const clean=name.trim().slice(0,12);if(!clean)return;p.name=clean;save();render()});document.querySelectorAll('.toy').forEach(b=>b.addEventListener('click',()=>tap(Number(b.dataset.index))));document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;['room','adopt','breed','book'].forEach(p=>$(p+'Page').classList.toggle('hide',p!==page));document.querySelectorAll('[data-page]').forEach(t=>t.classList.toggle('active',t.dataset.page===page));render()}));$('adopt').addEventListener('click',()=>{if(s.coins<price()||s.pets.length>=20)return;s.coins-=price();const pool=['gray','cream','white','black','violet','ebony'];const fur=pool[rand(pool.length)];addPet(fur,furById(fur)[1]+'ちゃん')});$('breed').addEventListener('click',()=>{const a=s.pets.find(p=>String(p.id)===$('parent1').value),b=s.pets.find(p=>String(p.id)===$('parent2').value);if(!a||!b||a.id===b.id){show('異なる2匹を選んでね');return}if(s.coins<200||s.breeding||s.pets.length>=20)return;s.coins-=200;s.breeding={fur1:a.fur,fur2:b.fur,end:Date.now()+300000};show('💕 繁殖が始まったよ！ 5分後が楽しみ！');save();render()});
grantOffline();render();setInterval(()=>{if(document.hidden)return;const now=Date.now(),n=Math.floor((now-s.lastAuto)/10000);if(n>0){s.coins+=n*income();s.lastAuto+=n*10000;show('🐾 チンチラたちが遊んだ！ +'+(n*income())+'コイン');save()}checkBreedSafe();render()},1000);setInterval(()=>{if(!document.hidden)wander()},2100);document.addEventListener('visibilitychange',()=>{if(!document.hidden){const now=Date.now(),n=Math.floor(Math.min(now-s.lastAuto,7200000)/10000);if(n>0){s.coins+=Math.floor(n*income()*.5);s.lastAuto=now;show('🐭 おかえり！ +'+Math.floor(n*income()*.5)+'コイン')}checkBreedSafe();save();render()}});window.addEventListener('pagehide',save);
})();
</script></body></html>
